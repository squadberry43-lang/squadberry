<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SquadBerry — Soporte TI</title>
  <desc id="desc">Marca SquadBerry con una manzana tecnológica, auricular de soporte y degradados azul, cian y violeta.</desc>
  <defs>
    <linearGradient id="berry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".48" stop-color="#1457F4"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#41E7F5"/>
      <stop offset=".55" stop-color="#1473F5"/>
      <stop offset="1" stop-color="#173BD4"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
